<style>
:root {
  --navy: #12355B;
  --sheet: #F3F5F8;
  --card: #FFFFFF;
  --line: #D9E0E8;
  --ink: #12355B;
  --orange: #E8650A;
  --f: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  background: var(--navy);
  color-scheme: light;
}

body {
  font: 500 16px/1.5 var(--f);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  background: var(--navy);
  -webkit-font-smoothing: antialiased;
}

.page {
  width: 100%;
  max-width: 460px;
  min-height: 100vh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--sheet);
  position: relative;
}

/* Hero photo block */
.hero {
  width: 100%;
  height: 70vh;
  min-height: 420px;
  max-height: 640px;
  position: relative;
  overflow: hidden;
  background: var(--navy);
}

.hero picture,
.hero img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  object-position: center top;
  border: 0;
  outline: none;
}

/* Content sheet */
.sheet {
  flex: 1;
  background: var(--sheet);
  border-radius: 28px 28px 0 0;
  margin-top: -28px;
  position: relative;
  z-index: 1;
  padding: 32px 20px calc(32px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
}

.intro {
  text-align: center;
  margin-bottom: 28px;
}

h1 {
  font-weight: 700;
  font-size: 26px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  color: var(--navy);
}

.bio {
  color: var(--navy);
  opacity: 0.85;
  font-size: 15px;
  line-height: 1.4;
  margin-top: 6px;
}

/* Links */
.links {
  list-style: none;
  padding: 0;
  display: grid;
  gap: 12px;
  width: 100%;
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 56px;
  padding: 16px 20px;
  border-radius: 9999px;
  background: var(--card);
  border: 1px solid var(--line);
  color: var(--ink);
  text-decoration: none;
  font-weight: 600;
  font-size: 16px;
  line-height: 1.25;
  text-align: center;
  transition: transform 150ms ease, border-color 150ms ease;
  cursor: pointer;
}

.btn {
  -webkit-tap-highlight-color: transparent;
}

.btn:active,
.btn:focus-visible {
  background: var(--orange);
  border-color: var(--orange);
  color: #FFFFFF;
}

@media (hover: hover) {
  .btn:hover {
    transform: translateY(-2px);
    background: var(--orange);
    border-color: var(--orange);
    color: #FFFFFF;
  }
}

.btn:focus-visible {
  outline: 3px solid var(--navy);
  outline-offset: 3px;
}

footer {
  text-align: center;
  font-size: 13px;
  color: var(--navy);
  opacity: 0.75;
  margin-top: 32px;
}

@media (prefers-reduced-motion: reduce) {
  .btn {
    transition: none;
  }
  .btn:hover {
    transform: none;
  }
}
</style>
